{% extends "base.html" %}

{% block content %}

<style>
.forgot-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:80vh;
}

.forgot-card{
    width:380px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.forgot-card h2{
    text-align:center;
    margin-bottom:10px;
}

.forgot-card p{
    text-align:center;
    font-size:14px;
    color:#666;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:20px;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
}

.input-group input:focus{
    border-color:#4CAF50;
    outline:none;
}

.reset-btn{
    width:100%;
    padding:12px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
}

.reset-btn:hover{
    background:#43a047;
}

.back-login{
    text-align:center;
    margin-top:20px;
}

.back-login a{
    text-decoration:none;
    color:#4CAF50;
}
</style>

<div class="forgot-wrapper">

<div class="forgot-card">

<h2>{{ _("Forgot Password") }}</h2>
<p>{{ _("Enter your email or phone to receive an OTP") }}</p>

<form method="POST">

<div class="input-group">
<input type="text" name="identifier" placeholder="{{ _('Email or Phone Number') }}" required>
</div>

<button type="submit" class="reset-btn">{{ _("Send OTP") }}</button>

</form>

<div class="back-login">
<a href="{{ url_for('auth.login') }}">← {{ _("Back to Login") }}</a>
</div>

</div>

</div>

{% endblock %}
