{% extends "base.html" %}

{% block content %}
<style>
    .auth-card{
        margin-top: 80px;
    }
</style>

<div class="auth-card">

<h2>{{ _("Reset Password") }}</h2>

<form method="POST">

<input type="password" name="password" placeholder="{{ _('New Password') }}" required>

<input type="password" name="confirm" placeholder="{{ _('Confirm Password') }}" required>

<button type="submit">{{ _("Update Password") }}</button>

</form>

</div>

{% endblock %}
